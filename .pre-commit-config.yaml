repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: system
        types_or: [ts, tsx, javascript, css, json, markdown, yaml, html]
        exclude: ^(pnpm-lock\.yaml|src-tauri/(gen|icons|target)/)
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path src-tauri/Cargo.toml
        language: system
        types: [rust]
        pass_filenames: false
